<title>Rechenstern</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" id="favicon" href="data:,">
<script id="early">(function(){var r=document.documentElement;window.__studioHost=r.getAttribute("data-theme");try{var t=localStorage.getItem("studio-theme");if(t==="light"||t==="dark")r.setAttribute("data-theme",t);if(localStorage.getItem("studio-lang")==="en")r.lang="en";}catch(e){}})();</script>
<style>
/* Layout: Lernspiel im Familien-App-Studio (Bordeaux und Gold, Systemschrift, Zahlen gerundet).
   Kopf mit Logo „Rechenstern“, darunter Ansichten Spielen · Sammlung · Schatztruhe; Tab-Leiste am iPhone, Navigationspille ab iPad quer. */
:root{
  --bg:#FAF7F2; --surface:#FFFFFF; --fill:#F1EBE3; --line:#E5DDD3; --fg:#1D1A1C; --muted:#675E62;
  --accent:#7A1E3A; --accent-strong:#5A1028; --tint:#F3E3E8; --on-accent:#FFFFFF;
  --gold:#C8963E; --gold-ink:#8A6420; --gold-tint:#F7EBD3; --ok:#276F38; --ok-tint:#E2F0E4; --bad:#B3261E; --bad-tint:#F9E3E1;
  --key:#FFFFFF; --tile-line:transparent; --on-gold:#FFFFFF; --choco:#6E4026; --choco-hi:#9A6238; --shadow:0 1px 2px rgb(60 20 30 / .06),0 4px 14px rgb(60 20 30 / .06);
  --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r-s:8px; --r-m:12px; --r-l:16px; --r-xl:22px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141012; --surface:#1E191B; --fill:#2A2326; --line:#3A3134; --fg:#F4EEEA; --muted:#ADA3A6;
  --accent:#E57A98; --accent-strong:#F29BB3; --tint:#3A1C26; --on-accent:#141012;
  --gold:#E3B866; --gold-ink:#E3B866; --gold-tint:#3A2E18; --ok:#6CC97A; --ok-tint:#1C3322; --bad:#FF8A80; --bad-tint:#3D1E1C;
  --key:#2A2326; --tile-line:#3A3134; --on-gold:#141012; --choco:#8C5530; --choco-hi:#B97A48; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141012; --surface:#1E191B; --fill:#2A2326; --line:#3A3134; --fg:#F4EEEA; --muted:#ADA3A6;
  --accent:#E57A98; --accent-strong:#F29BB3; --tint:#3A1C26; --on-accent:#141012;
  --gold:#E3B866; --gold-ink:#E3B866; --gold-tint:#3A2E18; --ok:#6CC97A; --ok-tint:#1C3322; --bad:#FF8A80; --bad-tint:#3D1E1C;
  --key:#2A2326; --tile-line:#3A3134; --on-gold:#141012; --choco:#8C5530; --choco-hi:#B97A48; --shadow:none; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html:has(dialog[open]){overflow:hidden}
body{background:var(--bg);color:var(--fg);font:17px/1.45 var(--f-body);-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
button{font:inherit;color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
.num{font-family:var(--f-round);font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.app{max-width:1000px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:18px;
  padding-block:12px calc(104px + env(safe-area-inset-bottom,0px))}
.app > *{min-width:0}

/* Kopf */
.top{display:flex;align-items:center;gap:10px;min-height:56px}
.brandbtn{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;min-height:44px;border-radius:var(--r-m)}
.brandbtn:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.mark svg{width:40px;height:40px;display:block}
.wm{display:grid;line-height:1.15}
.wm b{font:700 21px/1.1 var(--f-display);letter-spacing:-.01em}
.wm small{font-size:13px;color:var(--muted)}
.toptabs{display:none;margin-left:auto;background:var(--fill);border-radius:99px;padding:3px;gap:2px}
.toptabs button{all:unset;cursor:pointer;padding:0 16px;min-height:38px;display:inline-flex;align-items:center;border-radius:99px;font:500 15px/1 var(--f-body);color:var(--muted)}
.toptabs button[aria-current="page"]{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:0 1px 3px rgb(0 0 0 / .12)}
.toptabs button:focus-visible{outline:3px solid var(--accent)}
.starpill{all:unset;cursor:pointer;margin-left:auto;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px 0 10px;border-radius:99px;background:var(--gold-tint);color:var(--gold-ink);font:700 18px/1 var(--f-round)}
.starpill svg{width:22px;height:22px}
.starpill:focus-visible{outline:3px solid var(--accent)}
.gear{all:unset;cursor:pointer;width:44px;height:44px;display:grid;place-items:center;border-radius:50%;color:var(--accent);flex:none}
.gear svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.gear:hover{background:var(--fill)}
.gear:focus-visible{outline:3px solid var(--accent)}
svg.st-ico{fill:var(--gold)}

/* Tab-Leiste (iPhone, iPad hochkant) */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);
  background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--line);padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabbar button{all:unset;cursor:pointer;display:grid;justify-items:center;gap:2px;min-height:48px;padding-top:4px;font:500 11px/1.2 var(--f-body);color:var(--muted)}
.tabbar svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-current="page"]{color:var(--accent)}
.tabbar button:focus-visible{outline:3px solid var(--accent);border-radius:8px}
@media (max-width:999px){.wm small{display:none}}
@media (min-width:800px){
  .tabbar{display:none}
  .toptabs{display:flex}
  .starpill{margin-left:8px}
  .app{padding-bottom:48px}
}
body.playing .tabbar,body.playing .top{display:none}
body.playing .app{padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}

/* Bausteine */
.card{background:var(--surface);border-radius:var(--r-l);box-shadow:var(--shadow);padding:20px}
:root[data-theme="dark"] .card{border:1px solid var(--line)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .card{border:1px solid var(--line)}}
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border-radius:var(--r-m);font:600 17px/1.2 var(--f-body);text-align:center}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.primary:active{background:var(--accent-strong)}
.btn.tinted{background:var(--tint);color:var(--accent)}
.btn.plain{color:var(--accent);padding:0 12px}
.btn.danger{background:var(--bad);color:var(--surface)}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;cursor:default}
.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.kicker{font-size:13px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin:0 4px 8px}
.muted{color:var(--muted)}
.bar{height:10px;border-radius:99px;background:var(--fill);overflow:hidden}
.bar > i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--gold),color-mix(in srgb,var(--gold) 70%,var(--accent)));transition:width .6s ease}
.list{background:var(--surface);border-radius:var(--r-l);box-shadow:var(--shadow);overflow:hidden}
:root[data-theme="dark"] .list{border:1px solid var(--line)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .list{border:1px solid var(--line)}}
.row{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:14px;width:100%;min-height:64px;padding:10px 16px;position:relative}
.row + .row::before{content:"";position:absolute;top:0;left:70px;right:0;border-top:1px solid var(--line)}
.row:active{background:var(--fill)}
.row:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.row[aria-disabled="true"]{cursor:default}
.row .ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--tint);color:var(--accent);flex:none}
.row .ic svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.row .tx{display:grid;gap:1px;min-width:0;flex:1}
.row .tx b{font-weight:600}
.row .tx small{font-size:14px;color:var(--muted)}
.row .chev{width:10px;height:16px;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;flex:none}

/* Start */
.home{display:grid;gap:18px}
@media (min-width:880px){.home{grid-template-columns:minmax(0,5fr) minmax(0,6fr);align-items:start}}
.home > *{min-width:0}
.hero{display:grid;gap:16px}
.hello{font:700 28px/1.15 var(--f-round)}
.lvl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lvl .pill{font:700 14px/1 var(--f-round);background:var(--accent);color:var(--on-accent);border-radius:99px;padding:6px 10px}
.lvl b{font-weight:600}
.xpcap{font-size:14px;color:var(--muted);margin:6px 0 0}
.today{display:grid;grid-template-columns:auto 1fr;gap:12px 14px;align-items:center}
.ring{width:60px;height:60px;position:relative}
.ring svg{width:60px;height:60px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7}
.ring .tr{stroke:var(--fill)}
.ring .pr{stroke:var(--gold);stroke-linecap:round;transition:stroke-dashoffset .6s ease}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font:700 15px/1 var(--f-round)}
.ring.done .pr{stroke:var(--ok)}
.flame{width:60px;height:60px;display:grid;place-items:center;border-radius:50%;background:var(--gold-tint);color:var(--gold-ink)}
.flame svg{width:30px;height:30px;fill:currentColor}
.flame.off{background:var(--fill);color:var(--muted)}
.today .tx{display:grid;gap:1px}
.today .tx small{color:var(--muted);font-size:14px}
.ob{display:grid;gap:12px}
.ob input,.field input,.confirm input{all:unset;box-sizing:border-box;width:100%;min-height:50px;padding:0 14px;border-radius:var(--r-m);background:var(--fill);font:17px/1.2 var(--f-body);color:var(--fg)}
.ob input:focus-visible,.field input:focus-visible,.confirm input:focus-visible{outline:3px solid var(--accent)}
.ob .acts{display:flex;gap:8px;flex-wrap:wrap}

.reihen{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;display:grid;justify-items:center;gap:6px;padding:12px 4px 10px;border-radius:var(--r-l);background:var(--surface);box-shadow:var(--shadow);border:2px solid var(--tile-line);min-height:84px}
.tile b{font:700 26px/1 var(--f-round)}
.tile b small{font-size:.62em;color:var(--muted);margin-right:1px}
.tile .stars{display:flex;gap:1px}
.tile .stars svg{width:14px;height:14px}
.tile.master{border-color:var(--gold);background:var(--gold-tint)}
.tile.reco{border-color:var(--accent)}
.tile:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tile:active{transform:scale(.97)}
.stars .on{fill:var(--gold)}
.stars .off{fill:none;stroke:var(--line);stroke-width:2}
.legend{font-size:14px;color:var(--muted);margin:10px 4px 0}

/* Spielen */
.play{max-width:460px;width:100%;margin:0 auto;display:grid;gap:14px;padding-top:8px}
.pbar{display:flex;align-items:center;gap:10px}
.x{all:unset;cursor:pointer;width:44px;height:44px;display:grid;place-items:center;border-radius:50%;flex:none;color:var(--muted)}
.x svg{width:22px;height:22px;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
.x:hover{background:var(--fill)}
.x:focus-visible{outline:3px solid var(--accent)}
.segs{flex:1;display:flex;gap:4px;min-width:0}
.segs i{flex:1;height:10px;border-radius:99px;background:var(--fill)}
.segs i.ok{background:var(--ok)}
.segs i.bad{background:var(--bad)}
.segs i.cur{background:var(--gold)}
.timer{flex:1;height:10px;border-radius:99px;background:var(--fill);overflow:hidden}
.timer i{display:block;height:100%;background:var(--gold);width:100%}
.chip{display:inline-flex;align-items:center;gap:4px;min-height:32px;padding:0 10px;border-radius:99px;background:var(--gold-tint);color:var(--gold-ink);font:700 15px/1 var(--f-round);flex:none}
.chip svg{width:16px;height:16px;fill:currentColor}
.chip.off{visibility:hidden}
.qcard{display:grid;justify-items:center;gap:14px;padding:22px 16px 18px;text-align:center;position:relative}
.qlabel{font-size:14px;color:var(--muted);margin:0}
.q{font:700 clamp(52px,16vw,72px)/1 var(--f-round);font-variant-numeric:tabular-nums;letter-spacing:-.01em;display:flex;align-items:center;gap:.25em;flex-wrap:wrap;justify-content:center}
.q .op{color:var(--accent)}
.ans{min-width:150px;min-height:76px;padding:0 18px;border-radius:var(--r-l);border:3px solid var(--line);display:grid;place-items:center;font:700 54px/1 var(--f-round);font-variant-numeric:tabular-nums;background:var(--bg)}
.ans.empty{color:var(--line)}
.ans.right{border-color:var(--ok);background:var(--ok-tint);color:var(--ok);animation:pop .35s ease}
.ans.wrong{border-color:var(--bad);background:var(--bad-tint);color:var(--bad);animation:shake .35s ease}
.fb{margin:0;font:700 22px/1.2 var(--f-round)}
.fb.ok{color:var(--ok)}
.fb.bad{color:var(--bad)}
.fbsub{margin:0;color:var(--fg);max-width:34ch}
.plus{position:absolute;right:18px;top:16px;display:inline-flex;align-items:center;gap:3px;color:var(--gold-ink);font:700 20px/1 var(--f-round);animation:rise .8s ease forwards}
.plus svg{width:20px;height:20px;fill:var(--gold)}
.tipbtn{all:unset;cursor:pointer;min-height:40px;padding:0 14px;border-radius:99px;background:var(--fill);color:var(--accent);font:600 15px/1 var(--f-body);display:inline-flex;align-items:center;gap:6px}
.tipbtn:focus-visible{outline:3px solid var(--accent)}
.tip{margin:0;font-size:15px;color:var(--muted)}
.tip .num{color:var(--fg);font-weight:600}
.dots{display:grid;grid-template-columns:repeat(var(--cols,5),12px);gap:5px;justify-content:center;padding:4px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--gold)}
.dotcap{font-size:14px;color:var(--muted);margin:0}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.key{all:unset;box-sizing:border-box;cursor:pointer;display:grid;place-items:center;min-height:62px;border-radius:var(--r-l);background:var(--surface);box-shadow:var(--shadow);font:600 30px/1 var(--f-round);user-select:none;-webkit-user-select:none;touch-action:manipulation;background:var(--key)}
.key:active{transform:scale(.96);background:var(--fill)}
.key.ok{background:var(--accent);color:var(--on-accent);font:700 22px/1 var(--f-body)}
.key.del svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.key:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.kbd{font-size:13px;color:var(--muted);text-align:center;margin:0;display:none}
@media (hover:hover) and (pointer:fine){.kbd{display:block}}
.toastline{margin:0;text-align:center;font-weight:600;color:var(--ok)}

/* Ergebnis */
.result{max-width:520px;width:100%;margin:0 auto;display:grid;gap:16px;text-align:center;padding-top:8px}
.result .card{display:grid;gap:14px;justify-items:center}
.bigstars{display:flex;gap:8px;justify-content:center}
.bigstars svg{width:56px;height:56px}
.bigstars .on{fill:var(--gold);animation:pop .45s ease backwards}
.bigstars .on:nth-child(2){animation-delay:.15s}
.bigstars .on:nth-child(3){animation-delay:.3s}
.bigstars .off{fill:none;stroke:var(--line);stroke-width:1.6}
.result h2{font:700 32px/1.1 var(--f-round)}
.earn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:99px;background:var(--gold-tint);color:var(--gold-ink);font:700 19px/1 var(--f-round)}
.earn svg{width:20px;height:20px;fill:var(--gold)}
.lvlup{margin:0;font-weight:600;color:var(--accent)}
.newb{display:grid;gap:8px;width:100%}
.newb .b{display:flex;align-items:center;gap:12px;text-align:left;background:var(--bg);border-radius:var(--r-m);padding:10px 12px}
.result .acts{display:grid;gap:10px}
.starhint{font-size:14px;color:var(--muted);margin:0}
.xpwrap{width:100%;display:grid;gap:6px;text-align:left}

/* Sammlung */
.coll{display:grid;gap:18px}
@media (min-width:880px){.coll{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}}
.coll > *{min-width:0}
.boardwrap{overflow-x:auto}
.board{display:grid;grid-template-columns:repeat(11,minmax(26px,1fr));gap:3px;min-width:300px}
.board span{aspect-ratio:1;display:grid;place-items:center;border-radius:6px;font:600 11px/1 var(--f-round);font-variant-numeric:tabular-nums;background:var(--fill);color:var(--muted)}
.board span.h{background:none;color:var(--accent);font-size:13px}
.board span.p{background:var(--tint);color:var(--accent)}
.board span.s{background:var(--gold);color:var(--surface)}
:root[data-theme="dark"] .board span.s{color:var(--bg)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .board span.s{color:var(--bg)}}
.keyrow{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin-top:12px}
.keyrow i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:6px;background:var(--fill)}
.keyrow i.p{background:var(--tint);box-shadow:inset 0 0 0 1px var(--accent)}
.keyrow i.s{background:var(--gold)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.badge{display:grid;justify-items:center;gap:6px;text-align:center;padding:14px 10px;border-radius:var(--r-l);background:var(--surface);box-shadow:var(--shadow)}
:root[data-theme="dark"] .badge{border:1px solid var(--line)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .badge{border:1px solid var(--line)}}
.badge b{font-size:15px;line-height:1.2}
.badge small{font-size:13px;color:var(--muted);line-height:1.3}
.medal{width:56px;height:56px;flex:none}
.medal .rim{fill:var(--gold-tint);stroke:var(--gold);stroke-width:3}
.medal .gl{fill:none;stroke:var(--gold-ink);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.medal .gf{fill:var(--gold-ink)}
.medal text{fill:var(--gold-ink);font:800 15px var(--f-round)}
.badge.locked .medal .rim{fill:var(--fill);stroke:var(--line);stroke-dasharray:4 3}
.badge.locked .medal .gl{stroke:var(--muted);opacity:.5}
.badge.locked .medal .gf,.badge.locked .medal text{fill:var(--muted);opacity:.5}

/* Schatztruhe */
.chest{display:grid;gap:18px}
@media (min-width:880px){.chest{grid-template-columns:minmax(0,4fr) minmax(0,6fr);align-items:start}}
.chest > *{min-width:0}
.bal{display:grid;gap:6px;justify-items:start}
.bal .n{display:flex;align-items:center;gap:10px;font:800 54px/1 var(--f-round)}
.bal .n svg{width:46px;height:46px;fill:var(--gold)}
.rewards{display:grid;gap:10px}
.rw{display:grid;gap:10px}
.rw .head{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.rw .head b{font-size:18px}
.cost{display:inline-flex;align-items:center;gap:4px;color:var(--gold-ink);font:700 17px/1 var(--f-round)}
.cost svg{width:18px;height:18px;fill:var(--gold)}
.rw .foot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.rw .foot small{color:var(--muted);font-size:14px}
.confirm{display:grid;gap:10px;background:var(--bg);border-radius:var(--r-m);padding:14px}
.confirm p{margin:0}
.err{color:var(--bad);font-size:15px;margin:0}
.hist{display:grid;gap:0}
.hist .row{cursor:default;min-height:52px}
.hist .row + .row::before{left:16px}

/* Eltern-Bereich */
.parents{display:grid;gap:18px;max-width:720px;width:100%;margin:0 auto}
.parents h2{font:700 28px/1.15 var(--f-display)}
.field{display:grid;gap:6px;padding:12px 16px}
.field label{font-size:14px;color:var(--muted)}
.field + .field{border-top:1px solid var(--line)}
.pin{max-width:200px;letter-spacing:.4em;font-family:var(--f-round)}
.rwedit{display:grid;grid-template-columns:minmax(0,1fr) 72px 44px;gap:8px;align-items:center;padding:8px 12px}
.rwedit + .rwedit{border-top:1px solid var(--line)}
.rwedit input{all:unset;box-sizing:border-box;width:100%;min-height:44px;padding:0 12px;border-radius:var(--r-s);background:var(--fill);color:var(--fg)}
.rwedit input:focus-visible{outline:3px solid var(--accent)}
.rwedit .del{all:unset;cursor:pointer;width:44px;height:44px;display:grid;place-items:center;border-radius:50%;color:var(--bad)}
.rwedit .del svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.rwedit .del:focus-visible{outline:3px solid var(--accent)}
.stats{width:100%;border-collapse:collapse;font-size:15px}
.stats th,.stats td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
.stats th{font-size:13px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.stats td.n{font-family:var(--f-round);font-variant-numeric:tabular-nums;text-align:right}
.stats th.n{text-align:right}
.stats tr:last-child td{border-bottom:0}
.segw{padding:8px 12px}
.note{font-size:14px;color:var(--muted);margin:8px 4px 0}
.stack{display:grid;gap:18px;min-width:0}
.stack-s{display:grid;gap:12px}
.m0{margin:0}
.flush{margin:0 0 8px}
.small{font-size:14px}
.h-card{font-size:22px}
.sub-card{margin:4px 0 14px}
.btn.bad-link{color:var(--bad);padding:0}
.stats td:first-child{white-space:nowrap}
@media (max-width:480px){.stats th,.stats td{padding:10px 8px}}

/* Lernbereich „Entdecken“ */
.learn{display:grid;gap:18px}
@media (min-width:880px){.learn{grid-template-columns:minmax(0,6fr) minmax(0,5fr);align-items:start}.learn .surprise{grid-column:1/-1}}
.learn > *{min-width:0}
.surprise{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px 16px;align-items:center;background:linear-gradient(135deg,var(--tint),var(--gold-tint))}
.surprise .btn{grid-column:1/-1}
@media (min-width:600px){.surprise{grid-template-columns:auto minmax(0,1fr) auto}.surprise .btn{grid-column:auto;padding:0 28px}}
.surprise .tx{display:grid;gap:4px;min-width:0}
.surprise h2{font:700 24px/1.15 var(--f-round)}
.spark svg{width:56px;height:56px;fill:var(--gold);display:block;animation:twinkle 3.2s ease-in-out infinite}
.pathcard{display:grid;gap:14px}
.rchips{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
@media (min-width:600px) and (max-width:879px){.rchips{grid-template-columns:repeat(10,minmax(0,1fr))}}
.rchip{all:unset;box-sizing:border-box;cursor:pointer;display:grid;justify-items:center;gap:5px;padding:8px 0 7px;border-radius:var(--r-m);background:var(--fill);min-height:50px}
.rchip b{font-size:19px;line-height:1}
.rchip.on{background:var(--accent);color:var(--on-accent)}
.rchip.full:not(.on){background:var(--gold-tint);color:var(--gold-ink)}
.rchip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.pips{display:flex;gap:3px}
.pips i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.pips i.on{background:var(--gold)}
.rchip.on .pips i{background:color-mix(in srgb,var(--on-accent) 35%,transparent)}
.rchip.on .pips i.on{background:var(--on-accent)}
.pathh{font:700 20px/1.2 var(--f-round)}
.list.flat{box-shadow:none;background:var(--bg)}
.stno{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--tint);color:var(--accent);font-weight:700;flex:none}
.station.done .stno{background:var(--ok);color:var(--on-gold)}
.stno svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.row + .station::before{left:66px}
.gold-ink{color:var(--gold-ink)}
.row .tx small.gold-ink{color:var(--gold-ink)}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.game{all:unset;box-sizing:border-box;cursor:pointer;display:grid;gap:4px;align-content:start;padding:16px;border-radius:var(--r-l);background:var(--surface);box-shadow:var(--shadow);border:1px solid var(--tile-line)}
.game b{font-weight:600;line-height:1.25}
.game small{font-size:14px;color:var(--muted);line-height:1.35}
.game:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.game:active{transform:scale(.98)}
.gic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--gold-tint);color:var(--gold-ink);margin-bottom:6px}
.gic svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* Aktivitäten */
.act{max-width:520px;width:100%;margin:0 auto;display:grid;gap:14px;padding-top:8px}
.act.wide{max-width:760px}
.act > *{min-width:0}
.acttitle{display:grid;line-height:1.2;min-width:0}
.acttitle b{font:700 19px/1.2 var(--f-round)}
.acttitle small{font-size:13px;color:var(--muted)}
.donebox{display:grid;gap:14px;justify-items:center;text-align:center}
.donebox h2{font:700 24px/1.2 var(--f-round)}
.donebox .acts,.frogcard .acts{display:grid;gap:10px;width:100%}
.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.choice{all:unset;box-sizing:border-box;cursor:pointer;display:grid;place-items:center;min-height:64px;border-radius:var(--r-l);background:var(--key);box-shadow:var(--shadow);border:1px solid var(--tile-line);font:700 28px/1 var(--f-round)}
.choice:active{transform:scale(.96)}
.choice:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.nope{animation:shake .35s ease;background:var(--bad-tint)!important;color:var(--bad)!important}
.frq{margin:0;text-align:center;font-weight:600}
.taskline{font-weight:600}

/* Schokoladen-Werkstatt */
.chocard{display:grid;gap:14px}
.chocowrap{display:grid;place-items:center}
.choco{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:3px;width:min(100%,380px);aspect-ratio:1;touch-action:none;user-select:none;-webkit-user-select:none;padding:6px;border-radius:12px;background:var(--fill);transition:transform .26s ease;cursor:pointer}
.choco.turn{transform:rotate(90deg) scale(.92)}
.choco:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.pc{border-radius:4px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);transition:background .08s}
.pc.on{background:linear-gradient(145deg,var(--choco-hi),var(--choco));box-shadow:inset 0 -2px 0 rgb(0 0 0 / .2)}
.pc.eaten{opacity:.06;transform:scale(.5);transition:all .15s}
.chinfo{display:grid;justify-items:center;gap:2px;text-align:center}
.chinfo b{font:700 34px/1.1 var(--f-round)}
.chinfo small{color:var(--muted);font-size:15px;max-width:40ch}
.chacts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* Frosch-Sprünge */
.frogcard{display:grid;gap:16px}
.pond{position:relative;height:130px;border-radius:14px;background:var(--ok-tint);overflow:hidden}
.lily{position:absolute;bottom:8px;left:calc(6px + (100% - 40px) * var(--x,0) / 10);width:28px;display:flex;flex-direction:column-reverse;align-items:center;gap:4px}
.lily i{width:28px;height:11px;border-radius:50%;background:color-mix(in srgb,var(--ok) 35%,transparent);transition:transform .15s,background .15s}
.lily.on i{background:var(--ok)}
.lily.beat i{background:var(--gold);transform:scale(1.5)}
.lily b{font:700 12px/1 var(--f-round);min-height:12px;color:var(--fg);position:relative;z-index:1;white-space:nowrap}
.lily:nth-child(even) b{transform:translateY(-14px)}
.frog{position:absolute;bottom:50px;left:calc(6px + (100% - 40px) * var(--x,0) / 10 - 6px);width:40px;transition:left .45s ease}
.frog svg{width:40px;height:34px;display:block}
.frog.hop{animation:hop .45s ease}
.frog .fb{fill:#4E9A5B}.frog .fw{fill:#FFFFFF}.frog .fe{fill:#1D1A1C}.frog .fm{fill:none;stroke:#1D1A1C;stroke-width:1.6;stroke-linecap:round}
.frrows{display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:center;font-size:14px;color:var(--muted)}
.frdone{font:700 22px/1.25 var(--f-round);text-align:center}
@keyframes hop{0%{transform:translateY(0)}45%{transform:translateY(-40px) rotate(-8deg)}100%{transform:translateY(0)}}

/* Zaubertricks */
.tricks{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.trickcard{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:var(--r-l);background:var(--surface);box-shadow:var(--shadow);border:1px solid var(--tile-line)}
.trickcard.learned{border-color:var(--gold);background:var(--gold-tint)}
.trickcard:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.trickcard .tx{display:grid;gap:2px;flex:1;min-width:0}
.trickcard .tx small{font-size:14px;color:var(--muted)}
.trickcard .tx small.gold-ink{color:var(--gold-ink);font-weight:600}
.trickdemo{display:grid;gap:14px}
.demo{display:grid;justify-items:center;gap:12px;padding:16px 10px;border-radius:12px;background:var(--bg);overflow-x:auto}
.dgrid{display:grid;grid-template-columns:repeat(var(--cols,5),14px);gap:5px}
.dgrid i{width:14px;height:14px;border-radius:50%;background:var(--accent);animation:pop .3s ease backwards}
.dgrid i.hot{background:var(--gold)}
.demotx{margin:0;font:700 22px/1.3 var(--f-round);text-align:center}
.demotx small{font-size:.7em}
.bigdemo{margin:0;font:800 76px/1 var(--f-round);display:flex}
.gold{color:var(--gold-ink)}
.pop{animation:pop .5s ease .25s backwards}
.acts.row2{display:flex;gap:10px;flex-wrap:wrap}
.acts.row2 .btn{flex:1 1 140px}
.hands{display:flex;gap:4px;align-items:flex-end;height:92px}
.finger{all:unset;cursor:pointer;width:26px;height:88px;display:flex;align-items:flex-end;justify-content:center}
.finger span{display:block;width:20px;height:78px;border-radius:10px 10px 6px 6px;background:var(--gold-tint);box-shadow:inset 0 0 0 2px var(--gold);transition:height .2s}
.finger.down span{height:30px;background:var(--accent);box-shadow:none}
.finger.gap{margin-right:12px}
.finger:focus-visible{outline:3px solid var(--accent);border-radius:8px}

/* Geschichten */
.storycard{display:grid;gap:14px}
.storytx{margin:0;font:600 19px/1.4 var(--f-body)}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px}
.grp{all:unset;box-sizing:border-box;cursor:pointer;display:grid;justify-items:center;gap:4px;padding:10px 6px;border-radius:12px;background:var(--bg);border:2px dashed var(--line)}
.grp.on{border:2px solid var(--gold);background:var(--gold-tint);animation:pop .3s ease}
.grp:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.grp b{font:700 17px/1 var(--f-round);color:var(--muted)}
.grp.on b{color:var(--gold-ink)}
.gimg svg{width:56px;height:56px;display:block}
.gimg .ln{fill:none;stroke:var(--fg);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.gimg .lf{fill:var(--ok)}
.gimg .lf2{fill:var(--accent)}
.gimg .gd{fill:var(--gold)}
.gimg .red{fill:#C8372D}
.gimg .blk{fill:var(--fg)}
.gimg .dk{stroke:var(--fg);stroke-width:1.6}
.gimg .box{fill:var(--gold-tint);stroke:var(--gold);stroke-width:2}
.gimg .egg{fill:var(--surface);stroke:var(--muted);stroke-width:1.4}
.gimg .day{fill:var(--accent)}
.gimg .pin{fill:var(--surface);stroke:var(--fg);stroke-width:1.6}
.gimg .pen{fill:var(--accent)}
.gimg .pen2{fill:var(--gold)}

/* Muster-Detektiv */
.mugrid{display:grid;gap:14px}
.hundred{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:3px}
.hc{all:unset;box-sizing:border-box;cursor:pointer;aspect-ratio:1;display:grid;place-items:center;border-radius:6px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);font:600 clamp(11px,3.2vw,16px)/1 var(--f-round)}
.hc.on{background:var(--gold);color:var(--on-gold);box-shadow:none;animation:pop .25s ease}
.hc:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.hundred.solved .hc:not(.on){opacity:.4}
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
.case{all:unset;box-sizing:border-box;cursor:pointer;display:grid;justify-items:center;gap:4px;padding:14px 6px;border-radius:var(--r-l);background:var(--surface);box-shadow:var(--shadow);border:1px solid var(--tile-line);position:relative;text-align:center}
.case b{font:700 26px/1 var(--f-round)}
.case small{font-size:13px;color:var(--muted)}
.case.solved{border-color:var(--gold);background:var(--gold-tint)}
.case svg{position:absolute;top:6px;right:6px;width:18px;height:18px;fill:none;stroke:var(--ok);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.case:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* Zufallsmodus */
.spincard{display:grid;justify-items:center;gap:10px;padding-block:40px;text-align:center}
.spinstar svg{width:96px;height:96px;fill:var(--gold);display:block;animation:spin 1.6s cubic-bezier(.2,.8,.3,1) both}
.spinname{margin:0;font:800 30px/1.2 var(--f-round);color:var(--accent);min-height:1.2em}
@keyframes spin{from{transform:rotate(0) scale(.6)}to{transform:rotate(720deg) scale(1)}}
@keyframes twinkle{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.08) rotate(8deg)}}

/* Einstellungsmenü (Studio-Baustein, Team-Standard 6 und 7) */
dialog.settings{border:0;padding:0;border-radius:var(--r-xl);width:min(440px,calc(100vw - 32px));background:var(--bg);color:var(--fg);box-shadow:0 20px 60px rgb(0 0 0 / .3)}
dialog.settings::backdrop{background:rgb(20 10 15 / .45)}
.st{padding:8px 18px 22px;display:grid}
.st-grab{display:none;width:36px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 6px}
.st-bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;font:600 17px/22px var(--f-body);min-height:44px}
.st-done{all:unset;justify-self:end;cursor:pointer;color:var(--accent);font:600 17px/22px var(--f-body);min-height:44px;padding:0 4px;display:inline-flex;align-items:center}
.st-done:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.st-head{margin:18px 14px 6px;font-size:13px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
.st-foot{margin:6px 14px 0;font-size:13px;color:var(--muted)}
.st-group{background:var(--surface);border-radius:var(--r-m);padding:4px}
.st-group .row{min-height:48px;padding:6px 10px}
.st-group .row .tx b{font-weight:500}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;background:var(--fill);border-radius:8px;padding:2px;min-height:44px}
.seg label{position:relative;display:grid}
.seg input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.seg span{display:grid;place-items:center;border-radius:6px;font:500 15px/20px var(--f-body);color:var(--muted);padding:0 4px;text-align:center}
.seg input:checked + span{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:0 1px 3px rgb(0 0 0 / .14)}
.seg input:focus-visible + span{outline:3px solid var(--accent);outline-offset:1px}
.st-about{display:flex;align-items:center;gap:12px;padding:12px 14px}
#st-icon svg{width:44px;height:44px;display:block}
.st-t{display:grid;gap:2px;min-width:0}
.st-t b{font:600 17px/22px var(--f-body)}
.st-t small{font-size:13px;color:var(--muted)}
@media (max-width:600px){
  dialog.settings{width:100%;max-width:100%;margin:auto 0 0;border-radius:20px 20px 0 0;max-height:calc(100dvh - 40px)}
  .st{padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}
  .st-grab{display:block}
}

/* Hinweis unten und Konfetti */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;align-items:center;gap:12px;
  max-width:calc(100vw - 32px);padding:10px 10px 10px 16px;border-radius:var(--r-m);background:var(--fg);color:var(--bg);font-size:15px;box-shadow:0 8px 24px rgb(0 0 0 / .25)}
.toast button{all:unset;cursor:pointer;font-weight:700;color:var(--gold);min-height:36px;padding:0 8px}
.toast button:focus-visible{outline:2px solid var(--gold)}
@media (min-width:800px){.toast{bottom:24px}}
body.playing .toast{bottom:calc(16px + env(safe-area-inset-bottom,0px))}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}

@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes rise{0%{transform:translateY(8px);opacity:0}30%{opacity:1}100%{transform:translateY(-18px);opacity:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

function t(k, v = {}){
  const e = STR[k]; const s = e ? (LANG === "en" ? e[1] : e[0]) : k;
  return s.replace(/\{(\w+)\}/g, (m, x) => v[x] ?? m);
}
const fmt = n => Number(n).toLocaleString(LOC());
const fmtDate = ts => new Date(ts).toLocaleDateString(LOC(), { day:"numeric", month:"long", year:"numeric" });

/* ---------- Spielstand (Daten-Dieter): nur lokal im Browser ---------- */
const KEY = "rechenstern-v1";
const DEFAULT = () => ({ v:1, name:"", skipName:false, facts:{}, stars:0, xp:0, reihe:{}, badges:{},
  day:{ date:"", count:0, goalDone:false }, streak:{ days:0, last:"" }, bestStreak:0, blitzBest:0, rounds:0,
  path:{}, tricks:{}, cases:{}, stories:0, goal:20, sound:true, pinH:"", pinFail:{ n:0, until:0 }, bonusDay:{}, knobelHad:false,
  rewards:[{ id:"r1", key:"rw_r1", cost:60 }, { id:"r2", key:"rw_r2", cost:100 }, { id:"r3", key:"rw_r3", cost:300 }], redeemed:[] });
let S = load();
function load(){
  const D = DEFAULT();
  try {
    const raw = localStorage.getItem(KEY); if (!raw) return D;
    const d = JSON.parse(raw); if (!d || d.v !== 1) return D;
    const isObj = x => x && typeof x === "object" && !Array.isArray(x);
    for (const k of Object.keys(D)){            // jedes Feld einzeln prüfen (Daten-Dieter)
      const v = d[k], dv = D[k];
      if (Array.isArray(dv)) { if (Array.isArray(v)) D[k] = v; }
      else if (isObj(dv)) { if (isObj(v)) D[k] = Object.assign(dv, v); }
      else if (typeof v === typeof dv) D[k] = v;
    }
    if (typeof d.pinH === "string") D.pinH = d.pinH;
    if (isObj(d.pinFail)) D.pinFail = { n: +d.pinFail.n || 0, until: +d.pinFail.until || 0 };
    if (isObj(d.bonusDay)) D.bonusDay = d.bonusDay;
    D.rewards = D.rewards.filter(r => isObj(r) && r.id && +r.cost > 0);
    D.redeemed = D.redeemed.filter(isObj);
    for (const [k, f] of Object.entries(D.facts)) if (!isObj(f)) delete D.facts[k]; else { f.c = +f.c || 0; f.w = +f.w || 0; f.box = Math.max(0, Math.min(5, +f.box || 0)); }
    return D;
  } catch(e){ return DEFAULT(); }
}
/* Eltern-PIN nur als Prüfsumme speichern, mit Sperre nach Fehlversuchen (Sicherheits-Siggi) */
async function pinHash(pin){
  const txt = "rechenstern:" + pin;
  try { const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(txt)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join(""); }
  catch(e){ let h = 2166136261; for (const ch of txt){ h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return "f" + (h >>> 0).toString(16); }
}
const hasPin = () => !!S.pinH;
const lockLeft = () => Math.max(0, Math.ceil(((S.pinFail?.until || 0) - Date.now()) / 1000));
async function checkPin(pin){
  if (lockLeft()) return "locked";
  if (await pinHash(pin) === S.pinH){ S.pinFail = { n: 0, until: 0 }; save(); return "ok"; }
  const n = (S.pinFail?.n || 0) + 1;
  S.pinFail = { n, until: n >= 3 ? Date.now() + 30000 * Math.pow(2, Math.min(5, n - 3)) : 0 }; save();
  return n >= 3 ? "locked" : "wrong";
}
const pinErr = r => r === "locked" ? t("pinLocked", { n: lockLeft() }) : t("pinWrong");
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }

const pad2 = n => String(n).padStart(2, "0");
const dayStr = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const today = () => dayStr(new Date());
const yesterday = () => { const d = new Date(); d.setDate(d.getDate() - 1); return dayStr(d); };
function touchDay(){
  const d = today();
  if (S.day.date !== d) S.day = { date:d, count:0, goalDone:false };
  if (S.streak.last !== d){ S.streak.days = S.streak.last === yesterday() ? S.streak.days + 1 : 1; S.streak.last = d; }
}
const todayCount = () => S.day.date === today() ? S.day.count : 0;
const todayGoalDone = () => S.day.date === today() && S.day.goalDone;
const streakNow = () => (S.streak.last === today() || S.streak.last === yesterday()) ? S.streak.days : 0;

/* ---------- Lernlogik (Wissens-Wilma) ---------- */
const ORDER = [1, 10, 2, 5, 3, 4, 6, 9, 7, 8];   // erst Kernaufgaben, die schweren Reihen zuletzt
const key = (a, b) => `${a}x${b}`;
const fact = (a, b) => S.facts[key(a, b)] || (S.facts[key(a, b)] = { c:0, w:0, box:0 });
const box = (a, b) => S.facts[key(a, b)]?.box || 0;
const seen = (a, b) => { const f = S.facts[key(a, b)]; return f ? f.c + f.w > 0 : false; };
const mastered = a => { for (let b = 1; b <= 10; b++) if (box(a, b) < 3) return false; return true; };
function reiheStars(a){ if (mastered(a)) return 3; const best = S.reihe[a]?.best || 0; return best >= 10 ? 2 : best >= 7 ? 1 : 0; }
const solidCount = () => { let n = 0; for (let a = 1; a <= 10; a++) for (let b = 1; b <= 10; b++) if (box(a, b) >= 3) n++; return n; };
const recoReihe = () => ORDER.find(a => reiheStars(a) < 2) ?? ORDER.find(a => reiheStars(a) < 3) ?? null;
function allFacts(){ const l = []; for (let a = 1; a <= 10; a++) for (let b = 1; b <= 10; b++) l.push([a, b]); return l; }
function knobelList(){ return Object.entries(S.facts).filter(([, f]) => f.w > 0 && f.box < 2).map(([k]) => k.split("x").map(Number)); }
function shuffle(l){ const a = l.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function pickWeighted(list, n, avoid){
  const pool = list.filter(([a, b]) => !avoid || key(a, b) !== avoid).map(([a, b]) => ({ a, b, w: Math.pow(6 - box(a, b), 2) * (a === 1 || a === 10 ? 0.4 : 1) }));
  const out = [];
  while (out.length < n && pool.length){
    let r = Math.random() * pool.reduce((s, x) => s + x.w, 0);
    let i = 0; while (i < pool.length - 1 && (r -= pool[i].w) > 0) i++;
    out.push([pool[i].a, pool[i].b]); pool.splice(i, 1);
  }
  return out;
}

let AC = null;
function tone(seq){
  if (!S.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = AC.currentTime;
    for (const [f, d, st] of seq){
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = "triangle"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0 + st); g.gain.exponentialRampToValueAtTime(0.16, t0 + st + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + st + d);
      o.connect(g).connect(AC.destination); o.start(t0 + st); o.stop(t0 + st + d + 0.05);
    }
  } catch(e){}
}

function burst(){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = $("#fx"), ctx = cv.getContext("2d"), dpr = window.devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; ctx.scale(dpr, dpr);
  const cs = getComputedStyle(document.documentElement), cols = ["--gold", "--accent", "--ok", "--gold"].map(v => cs.getPropertyValue(v).trim());
  const ps = Array.from({ length: 90 }, () => ({ x: innerWidth / 2 + (Math.random() - .5) * 120, y: innerHeight * .38, vx: (Math.random() - .5) * 11, vy: -Math.random() * 11 - 4,
    s: 5 + Math.random() * 6, r: Math.random() * 6, vr: (Math.random() - .5) * .3, c: cols[Math.floor(Math.random() * cols.length)] }));
  const t0 = performance.now();
  (function step(now){
    const k = (now - t0) / 1600; ctx.clearRect(0, 0, innerWidth, innerHeight);
    if (k >= 1) return;
    for (const p of ps){ p.vy += .32; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.globalAlpha = 1 - k; ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 3, p.s, p.s * .66); ctx.restore(); }
    requestAnimationFrame(step);
  })(t0);
}

  const q = P.queue[P.idx], r = q.a * q.b, ok = parseInt(P.input, 10) === r;
  record(q, ok);
  const id = P.id, i = P.idx;
  if (ok){ P.phase = "right"; tone(SND.right); renderPlay(); setTimeout(() => { if (P && P.id === id && P.idx === i) advance(); }, 750); }
  else {
    P.phase = "wrong"; tone(SND.wrong);
    P.again = false;
    if (P.mode !== "blitz" && !P.requeued.has(key(q.a, q.b))){ P.requeued.add(key(q.a, q.b)); P.queue.push({ a: q.a, b: q.b, swap: !q.swap, re: true }); P.again = true; }
    renderPlay();
    if (P.mode === "blitz") setTimeout(() => { if (P && P.id === id && P.idx === i) advance(); }, 1300);
  }
}
function record(q, ok){
  touchDay();
  const f = fact(q.a, q.b);
  if (ok){
    f.c++; if (!P.tip) f.box = Math.min(5, f.box + 1);
    P.streak++; P.maxStreak = Math.max(P.maxStreak, P.streak); S.bestStreak = Math.max(S.bestStreak, P.streak);
    S.xp++;
    if (!P.solid){ S.stars++; P.earned++; }        // gemeisterte Reihe: keine Sterne mehr, damit sich Üben der schweren Reihen lohnt
    if (P.idx < P.base) P.score++;
    if (P.mode === "blitz") P.blitz++;
    S.day.count++;                                // Tagesziel zählt nur richtige Antworten
  } else { f.w++; f.box = 0; P.streak = 0; S.knobelHad = true; }
  P.res[P.idx] = ok;
  if (!S.day.goalDone && S.day.count >= S.goal){ S.day.goalDone = true; S.stars += 10; P.earned += 10; P.goalJust = true; }
  P.fresh.push(...checkBadges({}));
  save();
}
function advance(){
  if (!P || V !== "play") return;
  P.idx++; P.input = ""; P.tip = false; P.phase = "ask"; P.goalJust = false;
  if (P.mode === "blitz"){
    if (Date.now() >= P.end){ endRound(); return; }
    const prev = P.queue[P.idx - 1];
    P.queue.push(...pickWeighted(allFacts(), 1, key(prev.a, prev.b)).map(([x, y]) => mk(x, y)));
  } else if (P.idx >= P.queue.length){ endRound(); return; }
  renderPlay();
}
function endRound(){
  if (!P) return;
  clearInterval(P.timer);
  const c = { perfect: false, mode: P.mode };
  S.rounds++;
  let bonus = 0;
  if ((P.mode === "reihe" || P.mode === "mix") && P.score === P.base){
    c.perfect = true;
    const bk = P.mode === "reihe" ? "r" + P.a : "mix";
    if (!P.solid && S.bonusDay[bk] !== today()){ bonus = 5; S.bonusDay[bk] = today(); }   // Bonus einmal pro Reihe und Tag
  }
  if (P.mode === "reihe"){ const x = S.reihe[P.a] || (S.reihe[P.a] = { best: 0 }); x.best = Math.max(x.best, P.score); }
  let rec = false;
  if (P.mode === "blitz" && P.blitz > S.blitzBest){ rec = S.blitzBest > 0; S.blitzBest = P.blitz; }
  S.stars += bonus; P.earned += bonus;
  const fresh = [...P.fresh, ...checkBadges(c)], l1 = lvlOf(S.xp);
  save();
  R = { mode: P.mode, a: P.a, score: P.score, base: P.base, blitz: P.blitz, earned: P.earned, bonus, fresh, lvlUp: l1 > P.lvl0 ? l1 : 0,
    rec, perfect: c.perfect, stars0: P.stars0, solid: P.solid, total: P.res.filter(Boolean).length, asked: P.res.length };
  P = null;
  show("result");
  if (R.perfect || R.lvlUp || R.rec || R.fresh.length){ tone(SND.win); setTimeout(burst, 150); }
}
function renderResult(){
  if (!R){ show("home"); return; }
  let title, sub, stars = "", hint = "";
  if (R.mode === "blitz"){
    title = R.rec ? t("rRecord") : R.blitz >= 10 ? t("rGood") : t("rOk");
    sub = t("rBlitz", { n: R.blitz }) + (S.blitzBest && !R.rec ? " · " + t("blitzRec", { n: S.blitzBest }) : "");
  } else {
    title = R.perfect || (R.mode === "knobel" && R.score === R.base) ? t("rPerfect") : R.score >= Math.ceil(R.base * 0.7) ? t("rGood") : t("rOk");
    sub = t("rSub", { c: R.score, t: R.base });
    if (R.mode === "knobel"){ const k = knobelList().length; sub += " · " + (k ? t("rKnobel", { n: k }) : t("rKnobel0")); }

    stars = `<div class="bigstars" role="img" aria-label="${esc(t("reiheAria", { n: R.a, s }))}">${[0, 1, 2].map(i => `<svg viewBox="0 0 24 24" class="${i < s ? "on" : "off"}" aria-hidden="true">${STAR}</svg>`).join("")}</div>`;
    hint = `<p class="starhint">${esc(t(["starHint0", "starHint1", "starHint2", "starHint3"][s]))}</p>`;

  const nextR = R.mode === "reihe" && reiheStars(R.a) >= 2 ? recoReihe() : null;
  const earned = R.earned === 1 ? t("earned1") : t("earned", { n: R.earned });
  $("#v-result").innerHTML = `<div class="result"><div class="card">
      ${stars}

      <div class="xpwrap">${levelBlock()}</div>

    </div>
    <div class="acts">

  if (kind === "frosch"){ A.a = opts.a || recoReihe() || 2; A.pos = 0; A.done = false; frOpts(); }

/* ---------- Bedienung Lernbereich ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  switch (b.dataset.act){
    case "learnReihe": LR = +b.dataset.a; render(); break;
    case "station": openAct(b.dataset.st, { a: +b.dataset.a }); break;
    case "game": { const g = b.dataset.g;
      if (g === "choco") openAct("schoko", {}); else if (g === "frog") openAct("frosch", { a: LR ?? recoReihe() ?? 2 });
      else if (g === "trick"){ A = { kind: "tricks" }; show("act"); } else if (g === "story") openAct("story"); else openAct("muster"); break; }

    case "chRot": chRot(); break;

    case "trFinger": A.s.k = +b.dataset.k; tone([[520, .08, 0]]); render(); break;

      if (v === A.q.r){ A.msgOk = true; A.msg = A.miss ? "trAgain" : "trRight"; tone(SND.right); }
      else { A.msgOk = false; A.msg = "trWrong"; A.miss = true; A.hint = true; tone(SND.wrong); }
      render(); break; }
    case "trNext": if (!A.miss) A.step++;
      if (A.step > 3){ if (!S.tricks[A.id]){ S.tricks[A.id] = Date.now(); reward(3); } tone(SND.win); burst(); }
      else trNewQ();
      render(); break;
    case "sgTap": if (!A.ok && +b.dataset.i === A.tapped){ A.tapped++; tone([[500 + A.tapped * 40, .08, 0]]); render(); } break;
    case "sgPick": { const { s, n } = A.list[A.i];
      if (+b.dataset.v === n * s.p){
        A.ok = true; A.right++; S.stories++; tone(SND.right);
        touchDay(); S.day.sg = S.day.sg || 0;
        if (!A.miss && S.day.sg < 10){ S.day.sg++; reward(1, true); } else { if (S.day.sg >= 10) A.cap = true; checkBadges({}); save(); }
      }
      else { A.msg = "sgWrong"; A.miss = true; tone(SND.wrong); }
      render(); break; }
    case "sgNext": A.i++; A.tapped = 0; A.ok = false; A.msg = ""; A.opts = null; A.miss = false; A.cap = false; if (A.i >= A.list.length){ tone(SND.win); burst(); } render(); break;
    case "muPick": A.c = b.dataset.c === "Q" ? "Q" : +b.dataset.c; A.found = new Set(); A.msg = ""; A.solved = false; A.err = 0; render(); break;
    case "muBack": A.c = null; render(); break;
    case "muCell": { if (A.solved) break; const n = +b.dataset.n, tg = caseTargets(A.c);
      if (A.found.has(n)) break;
      if (tg.includes(n)){ A.found.add(n); A.msg = ""; tone([[520 + A.found.size * 25, .07, 0]]);
        if (A.found.size === tg.length){ A.solved = true; if ((A.err || 0) <= 3){ if (!S.cases[A.c]){ S.cases[A.c] = Date.now(); reward(3); } } else A.msg = "noStar"; tone(SND.win); burst(); }
        render(); }
      else { A.err = (A.err || 0) + 1; A.msg = "no"; A.msgN = n; b.classList.add("nope"); tone(SND.wrong); setTimeout(() => { if (A && A.kind === "muster") renderMuster(); }, 450); }
      break; }
  }
});

/* ---------- Bedienung ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || b.disabled || b.getAttribute("aria-disabled") === "true") return;
  const act = b.dataset.act;
  switch (act){
    case "tab": if (P){ clearInterval(P.timer); P = null; } A = null; show(b.dataset.v); break;
    case "start": { const m = b.dataset.mode; startRound(m, m === "reihe" ? Number(b.dataset.a) : null); break; }
    case "key": typeKey(b.dataset.k); break;
    case "del": delKey(); break;
    case "ok": submit(); break;
    case "next": advance(); break;
    case "tip": if (P && P.phase === "ask"){ P.tip = true; renderPlay(); } break;
    case "close": if (P && P.res.length && !P.quit){ P.quit = true; renderPlay(); break; } if (P){ clearInterval(P.timer); P = null; } show("home"); break;
    case "quitNo": if (P){ P.quit = false; renderPlay(); } break;
    case "skipName": S.skipName = true; save(); render(); break;
    case "redeem": RD = { id: b.dataset.id, err: "" }; render(); break;
    case "rdCancel": RD = null; render(); break;
    case "parents": $("#settings").close(); show("eltern"); break;
    case "addReward": { const id = "r" + Date.now().toString(36); S.rewards.push({ id, name: t("newReward"), cost: 50 }); save(); render(); $(`#rw-n-${id}`)?.select(); break; }
    case "delReward": { const i = S.rewards.findIndex(r => r.id === b.dataset.id); if (i < 0) break; const [r] = S.rewards.splice(i, 1); undoBuf = { r, i }; save(); render(); toast(t("deleted", { r: rwName(r) }), true); break; }
    case "undo": if (undoBuf){ S.rewards.splice(Math.min(undoBuf.i, S.rewards.length), 0, undoBuf.r); undoBuf = null; save(); render(); $("#toast").hidden = true; } break;
    case "changePin": EL.change = true; EL.err = ""; render(); break;
    case "changeCancel": EL.change = false; EL.err = ""; render(); break;
    case "lock": show("home"); break;
    case "reset": EL.reset = true; render(); break;
    case "resetNo": EL.reset = false; render(); break;
    case "resetYes": { const keep = { goal: S.goal, sound: S.sound, pinH: S.pinH, pinFail: S.pinFail, rewards: S.rewards, name: S.name, skipName: S.skipName };
      S = Object.assign(DEFAULT(), keep); save(); EL.reset = false; render(); toast(t("pResetDone")); break; }
  }
});
document.addEventListener("submit", async e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === "ob"){ const n = $("#ob-name").value.trim(); if (n){ S.name = n; } else S.skipName = true; save(); render(); }
  else if (f.id === "cf-form"){
    const r = S.rewards.find(x => x.id === f.dataset.rid), pin = $("#cf-pin").value.trim();
    if (!r) return;
    const res = await checkPin(pin);
    if (res !== "ok"){ if (RD) RD.err = pinErr(res); render(); return; }
    if (S.stars < r.cost) { RD = null; render(); return; }
    S.stars -= r.cost; S.redeemed.push({ name: rwName(r), cost: r.cost, ts: Date.now() }); save(); RD = null; render();
    tone(SND.win); burst(); toast(t("redeemed", { r: rwName(r) }));
  }
  else if (f.id === "pin-form"){
    const mode = f.dataset.mode, p1 = $("#pin1").value.trim();
    if (mode === "set" && parseInt($("#pchk").value, 10) !== EL.check.a * EL.check.b){ EL.check = null; EL.err = t("pCheckWrong"); render(); return; }
    if (!/^\d{4}$/.test(p1)){ EL.err = t("pinShort"); render(); return; }
    if (mode !== "enter"){
      if (p1 !== $("#pin2").value.trim()){ EL.err = t("pinMismatch"); render(); return; }
      S.pinH = await pinHash(p1); S.pinFail = { n: 0, until: 0 }; save();
      EL = { open: true, err: "", reset: false, change: false, check: null }; render(); toast(t("pinSaved"));
    } else {
      const res = await checkPin(p1);
      if (res !== "ok"){ EL.err = pinErr(res); render(); return; }
      EL = { open: true, err: "", reset: false, change: false, check: null }; render();
    }
  }
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.id === "p-name"){ S.name = el.value.trim(); save(); }
  else if (el.name === "p-goal"){ S.goal = Number(el.value); save(); }
  else if (el.dataset.rid && el.dataset.f){
    const r = S.rewards.find(x => x.id === el.dataset.rid); if (!r) return;
    if (el.dataset.f === "name"){ const v = el.value.trim(); if (v){ r.name = v; delete r.key; } else el.value = rwName(r); }
    else { const n = parseInt(el.value.replace(/\D/g, ""), 10); r.cost = n > 0 ? Math.min(9999, n) : r.cost; el.value = r.cost; }
    save();
  }
});
document.addEventListener("keydown", e => {
  if (V !== "play" || !P || e.target.closest("input,dialog") || e.metaKey || e.ctrlKey || e.altKey) return;
  if (/^[0-9]$/.test(e.key)){ typeKey(e.key); e.preventDefault(); }
  else if (e.key === "Backspace"){ delKey(); e.preventDefault(); }
  else if (e.key === "Enter"){ if (e.target.closest("button") && P.phase !== "ask") return; submit(); e.preventDefault(); }
  else if (e.key === "Escape"){ if (P.res.length && !P.quit){ P.quit = true; renderPlay(); } else if (P.quit){ P.quit = false; renderPlay(); } else { clearInterval(P.timer); P = null; show("home"); } }
});

/* ---------- Sprache, Darstellung, Einstellungsmenü (Studio-Baustein) ---------- */
function applyLang(){
  document.documentElement.lang = LANG;
  document.title = "Rechenstern";
  $$("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  $("#open-settings").setAttribute("aria-label", t("gear"));
  $("#brandbtn").setAttribute("aria-label", t("home"));
  $$("#toptabs,#tabbar").forEach(n => n.setAttribute("aria-label", t("navAria")));
  render();
}
function storedTheme(){ try { const v = localStorage.getItem("studio-theme"); return v === "light" || v === "dark" ? v : "auto"; } catch(e){ return "auto"; } }
function applyTheme(v){
  const r = document.documentElement;
  if (v === "auto"){ if (window.__studioHost) r.setAttribute("data-theme", window.__studioHost); else r.removeAttribute("data-theme"); }
  else r.setAttribute("data-theme", v);
  $$('meta[name="theme-color"]').forEach(m => { if (m.dataset.orig == null) m.dataset.orig = m.content; m.content = v === "light" ? "#FAF7F2" : v === "dark" ? "#141012" : m.dataset.orig; });
}
(function(){
  const dlg = $("#settings");
  const sync = () => { $(`#st-theme-${storedTheme()}`).checked = true; $(`#st-lang-${LANG}`).checked = true; $(`#st-sound-${S.sound ? "on" : "off"}`).checked = true; };
  $("#open-settings").addEventListener("click", () => { sync(); try { dlg.showModal(); } catch(e){ dlg.setAttribute("open", ""); } });
  $("#st-done").addEventListener("click", () => dlg.close());
  dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });
  dlg.querySelectorAll('input[name="st-theme"]').forEach(i => i.addEventListener("change", () => {
    try { if (i.value === "auto") localStorage.removeItem("studio-theme"); else localStorage.setItem("studio-theme", i.value); } catch(e){}
    applyTheme(i.value);
  }));
  dlg.querySelectorAll('input[name="st-lang"]').forEach(i => i.addEventListener("change", () => {
    LANG = i.value === "en" ? "en" : "de";
    try { if (LANG === "de") localStorage.removeItem("studio-lang"); else localStorage.setItem("studio-lang", "en"); } catch(e){}
    applyLang();
  }));
  dlg.querySelectorAll('input[name="st-sound"]').forEach(i => i.addEventListener("change", () => { S.sound = i.value === "on"; save(); }));
  $("#mark").innerHTML = logoSvg("h");
  $("#st-icon").innerHTML = logoSvg("a");
  const fav = $("#favicon"); if (fav && fav.getAttribute("href") === "data:,") fav.href = "data:image/svg+xml," + encodeURIComponent(logoSvg("f"));
  applyTheme(storedTheme());
  applyLang();
  show("lernen");
})();
</script>
